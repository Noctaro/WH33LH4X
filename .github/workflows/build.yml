# Build pipeline for WH33LH4X.
#
# Purpose: make every commit produce the same artifacts the same way, on a machine that is
# not the author's: the checks, then the Windows bundle. A v* tag adds a draft release.

name: build

on:
  push:
    branches: [main, 'feature/**']
    # A release is this same pipeline with one more job on the end, so the thing users download
    # is built by the process that was already tested rather than by a second one written for
    # the occasion. GitHub ignores path filters on tag pushes, so the paths-ignore below cannot
    # cause a tag to build nothing.
    tags: ['v*']
    # Prose cannot change what gets built, so it should not cost a Windows build. Deliberately
    # NOT applied to pull_request: a merge is validated in full, whatever it touched.
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

# A run that has already been superseded is answering a question nobody is asking any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Artifact attestations are how this project makes a verifiable claim without paying for a
  # code signing certificate: they bind the built zip to the commit and workflow that produced
  # it, signed through Sigstore, and anyone can check it with
  #     gh attestation verify WH33LH4X-windows-x64.zip --repo Noctaro/WH33LH4X
  # These two are inert while the attestation step below is skipped.
  id-token: write
  attestations: write

jobs:
  checks:
    name: lint and control-law checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff==0.15.6

      - name: Ruff
        run: ruff check .

      # ffb_render.py holds control laws fitted against logged ticks from the real wheel, so a
      # change in what they output is a bug rather than a tuning opportunity. This is the only
      # check in the project that does not need the hardware present.
      - name: Control-law checks
        run: python test_ffb_render.py

      # The arming and force bytes that drove the motor, pinned; also needs no hardware.
      - name: Wire checks
        run: python test_gip.py

      # The bridge loop against a fake wheel: force sign, stop file, zero on close.
      - name: Bridge checks
        run: python test_bridge_core.py

      # Profiles, the bridge process handling and the force test verdict, without a window.
      - name: UI checks
        run: python test_ui.py

  bundle:
    name: assemble bundle
    runs-on: windows-latest
    needs: [checks]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # build_bundle.ps1 caches the embeddable CPython zip in dist\.cache and skips the
      # download when it is already there, so restoring that folder is all this needs. Keyed on
      # the pinned Python version: a version bump misses the cache and re-downloads, which is
      # the correct behaviour.
      - name: Cache embeddable Python
        uses: actions/cache@v6
        with:
          path: dist/.cache
          key: embeddable-python-3.11.9

      - uses: actions/cache@v6
        with:
          path: ~/AppData/Local/pip/Cache
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Build bundle
        shell: pwsh
        run: ./packaging/build_bundle.ps1

      # THE test for this job. The embeddable distribution ignores site-packages, so if the
      # ._pth rewrite or the vendoring were wrong, this is where it shows: the packages, the
      # libusb DLL pyusb loads, and the three packages of our own the launchers start.
      - name: Verify the bundled runtime imports
        shell: pwsh
        run: |
          ./dist/WH33LH4X/python/python.exe -c "import usb, libusb_package, pyvjoy, sv_ttk, bridge.core, gip.host, ui.profiles; print(libusb_package.get_library_path())"
          if ($LASTEXITCODE -ne 0) { throw "bundled runtime cannot import its own dependencies" }

      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash dist/WH33LH4X-windows-x64.zip -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content dist/SHA256SUMS.txt -Encoding ASCII
          Get-Content dist/SHA256SUMS.txt

      # SKIPPED WHILE THIS REPO IS PRIVATE, ON PURPOSE. GitHub artifact attestations are a
      # public-repository feature on Free, Pro and Team plans; on a user-owned private repo the
      # API refuses with "Feature not available for user-owned private repositories" and fails
      # the job -- which is exactly how run 32782325837 died. The step is gated rather than
      # deleted so it starts working by itself the day the repo is published, with nothing to
      # remember. If the context is ever missing the expression is falsy, so the failure mode
      # is a skipped step rather than a red build.
      - uses: actions/attest-build-provenance@v2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/WH33LH4X-windows-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: wh33lh4x-bundle
          path: |
            dist/WH33LH4X-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  # Only on a v* tag. Every other push stops at the job above, where the zip is a workflow
  # artifact: it expires, and downloading one needs a GitHub login. A release is what turns
  # that same file into something a stranger can click.
  release:
    name: draft the release
    runs-on: ubuntu-latest
    needs: [bundle]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      # The workflow grants read at the top. Creating a release needs write, and it is granted
      # HERE rather than there so no other job in this file can publish anything.
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wh33lh4x-bundle
          path: dist/

      # gh is preinstalled on the runner, so this needs no third-party action. In a project
      # whose whole trust story is "you can read everything we run", adding a dependency to
      # the step that produces the download would be the wrong place to save five lines.
      #
      # --draft is the point: the tag builds the artifacts and stages them, and a human still
      # has to read the notes and press publish. Nothing reaches users without that press.
      - name: Draft a release with the bundle attached
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks the repo out, and gh works out which repository it is talking
          # to from the local git remote. Without this it fails with "not a git repository".
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/WH33LH4X-windows-x64.zip \
            dist/SHA256SUMS.txt \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Draft. Replace these notes before publishing."
