# Lint config for WH33LH4X.
#
# Run before proposing a commit:
#     ruff check .
#
# Line length matches the house style already in the tree (~95 columns), which suits the
# long explanatory comments this project leans on. E501 is not in the default rule set, so
# this only matters if the `E` rules are switched on later -- it is recorded so that day
# does not turn into a reformat of every file.
line-length = 95
target-version = "py311"

[lint]
# Ruff's defaults: pyflakes (F) plus the pycodestyle errors that catch real breakage (E4,
# E7, E9). Deliberately not the full style suite -- this codebase is diagnostic tooling
# whose value is in its comments and measured constants, not in uniform formatting.
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# The ABI modules exist to mirror Windows headers exactly. Constants and structs are
# transcribed whether or not this repo happens to call them yet, because a partial
# transcription is how struct layouts silently go wrong -- see the GameInput v0/v3 hazard.
"gameinput_abi.py" = ["F401"]
"dinput_abi.py" = ["F401"]
